name: Code Quality Template

on:
  workflow_call:
  

jobs:
  quality_scan:
    name: "Run Code Quality Scanners"
    runs-on: [ np ]
    environment: Dev
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for git diff against base branch
          clean: true     # CRITICAL for self-hosted runners: wipe workspace before
                          # each run so leftover files from other branches (e.g. test.py
                          # from a standalone testing branch) never pollute this scan.

      # ── Detect PR-changed files ───────────────────────────────────────────
      # IMPORTANT: All scanners must only inspect files changed in THIS PR.
      # Scanning the full repo/branch would flag issues in files inherited from
      # develop that were never touched by this PR (e.g. test.py, old notebooks).
      - name: Detect PR-changed files
        id: changed_files
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Base: ${BASE_SHA}  Head: ${HEAD_SHA}"

          # All files added/modified in this PR (relative paths, no deletions)
          git diff --name-only --diff-filter=ACM "${BASE_SHA}...${HEAD_SHA}" \
            > pr-changed-files.txt || true

          echo "--- All PR-changed files ---"
          cat pr-changed-files.txt

          # Subset: only Python files inside lakehouse_framework/
          grep -E '^lakehouse_framework/.*\.py$' pr-changed-files.txt \
            > pr-changed-py.txt || true

          # Subset: only .ipynb notebook files inside lakehouse_framework/
          grep -E '^lakehouse_framework/.*\.ipynb$' pr-changed-files.txt \
            > pr-changed-nb.txt || true

          PY_COUNT=$(wc -l < pr-changed-py.txt | tr -d ' ')
          NB_COUNT=$(wc -l < pr-changed-nb.txt | tr -d ' ')
          echo "PR changed Python files : ${PY_COUNT}"
          echo "PR changed Notebooks    : ${NB_COUNT}"

          # Make available to subsequent steps
          echo "py_count=${PY_COUNT}"   >> $GITHUB_OUTPUT
          echo "nb_count=${NB_COUNT}"   >> $GITHUB_OUTPUT

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Set HOME variable
        run: |
          mkdir -p /tmp/runner-home
          echo "HOME=/tmp/runner-home" >> $GITHUB_ENV

      - name: Setup Node (for jscpd)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Tools
        run: |
          npm install -g jscpd
          pip install bandit semgrep jupyter nbconvert databricks-cli ruff

      # ── Gitleaks ─────────────────────────────────────────────────────────
      # Scans only the COMMITS introduced by this PR (not the full working tree).
      # This ensures files present in develop but not changed in this PR are
      # never flagged (e.g. test.py that a developer left in develop).
      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.1_linux_x64.tar.gz

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Scan only the commit range of this PR (not the entire working tree).
          # --log-opts scopes gitleaks to commits between base and head so that
          # secrets committed before this PR are not reported here.
          ./gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts "${BASE_SHA}...${HEAD_SHA}" \
            --report-path gitleaks-report.json \
            --report-format json \
            --exit-code 0 \
            -v || true

          [ -f gitleaks-report.json ] || echo "[]" > gitleaks-report.json

          COUNT=$(python3 -c "
          import json
          d = json.load(open('gitleaks-report.json'))
          print(len(d) if isinstance(d, list) else 0)
          ")
          echo "gitleaks_count=${COUNT}" >> $GITHUB_OUTPUT
          echo "Gitleaks: ${COUNT} finding(s)"

# ── jscpd (Python Only) — scan only PR-changed Python files ─────────────
      - name: Run jscpd
        id: jscpd
        continue-on-error: true
        run: |
          mkdir -p jscpd-report

          # jscpd MUST scan the FULL lakehouse_framework/ directory — not just
          # the PR-changed files. Duplication is a cross-file metric: a changed
          # file could duplicate code in an UNCHANGED file, which would be missed
          # if we only scanned the 5 files in the diff.
          # Pre-existing duplicates between unchanged files are also reported, but
          # that reflects the true health of the codebase this PR is merging into.
          #
          # Tuning notes (why min-lines=20, min-tokens=150):
          #   Databricks notebooks share required boilerplate — path setup, widget
          #   config, LakehouseConfig loading, Logger/MedallionPipelines init, and
          #   COMMAND separators. These are structurally identical across 150+ files
          #   but cannot be refactored away. Raising thresholds + ignoring boilerplate
          #   patterns ensures jscpd only flags real copy-pasted business logic.
          jscpd lakehouse_framework \
            --reporters json,console \
            --output jscpd-report \
            --pattern "**/*.py" \
            --ignore "**/.git/**,**/node_modules/**,**/__pycache__/**,**/*.pyc,**/.notebook_converted/**" \
            --min-lines 20 \
            --min-tokens 150 \
            --ignore-pattern "from utilities\.common_util|from pyspark\.sql|dbutils\.widgets|project_root|LakehouseConfig|Logger\.get_logger|MedallionPipelines|COMMAND ----------|MAGIC %|import sys|from pathlib import|from typing import|config\.catalog_|config\.get_schema_value|logger\.info\(f\"|raise ValueError|if not environment|if str\(project_root\)|sys\.path\.insert|config_path = f|except Exception|medallion_obj\.|# Initialize |# Import necessary|# Define widget|# Validate required|# Load configuration|# Get the current|# Construct catalog|# Log configuration|# Get metadata|environment = dbutils|config = LakehouseConfig|metadata_table = config\." \
            --threshold 0 || true

          # Fallback check
          if [ ! -f jscpd-report/jscpd-report.json ]; then
            echo '{"statistics":{"total":{"percentage":0,"clones":0,"duplicatedLines":0}},"duplicates":[]}' > jscpd-report/jscpd-report.json
          fi
      # ── Semgrep — scan only PR-changed Python files ───────────────────────
      - name: Run Semgrep
        id: semgrep
        continue-on-error: true
        run: |
          PY_COUNT=$(wc -l < pr-changed-py.txt | tr -d ' ')
          if [ "${PY_COUNT}" -eq 0 ]; then
            echo "No Python files changed in this PR — skipping Semgrep"
            echo '{"results":[]}' > semgrep-report.json
          else
            # -a: read file list from file (correct syntax — avoids broken
            # `|| true < file` redirect which feeds the file to `true` not xargs)
            # -r: don't run the command if the file list is empty
            xargs -a pr-changed-py.txt -r semgrep scan \
              --config auto \
              --json \
              --output semgrep-report.json || true
          fi
          [ -f semgrep-report.json ] || echo '{"results":[]}' > semgrep-report.json

      # ── Notebook conversion — PR-changed notebooks only ───────────────────
      - name: Convert notebooks for scanning
        run: |
          mkdir -p .notebook_converted
          NB_COUNT=$(wc -l < pr-changed-nb.txt | tr -d ' ')
          if [ "${NB_COUNT}" -eq 0 ]; then
            echo "No notebooks changed in this PR — skipping notebook conversion"
          else
            # Only convert notebooks that were actually changed in this PR
            while IFS= read -r nb_path; do
              [ -f "${nb_path}" ] || continue
              safe_name=$(echo "${nb_path}" | tr '/' '_' | sed 's/\.ipynb$/.py/')
              jupyter nbconvert --to script "${nb_path}" --stdout 2>/dev/null \
                | grep -v '^# In\[' | grep -v '^# %%' \
                > ".notebook_converted/${safe_name}" || true
            done < pr-changed-nb.txt
          fi

      # ── Bandit — scan only PR-changed Python files ────────────────────────
      - name: Run Bandit
        id: bandit
        continue-on-error: true
        run: |
          PY_COUNT=$(wc -l < pr-changed-py.txt | tr -d ' ')
          if [ "${PY_COUNT}" -eq 0 ]; then
            echo "No Python files changed in this PR — skipping Bandit"
            echo '{"results":[],"metrics":{}}' > bandit-py-report.json
          else
            # Scan only the files changed in this PR, not the whole directory.
            # xargs -a reads the file list from a file (correct syntax).
            # xargs -r skips execution if the file list is empty.
            # --severity-level high: only report HIGH severity findings; these are
            # the only ones that fail the Quality Gate, so scanning beyond HIGH
            # adds noise without affecting pass/fail decisions.
            xargs -a pr-changed-py.txt -r bandit \
              -f json -o bandit-py-report.json \
              --severity-level high || true
          fi
          if [ -d .notebook_converted ] && [ "$(ls -A .notebook_converted)" ]; then
            bandit -r .notebook_converted/ -f json -o bandit-nb-report.json --severity-level high || true
          fi
          [ -f bandit-py-report.json ] \
            || echo '{"results":[],"metrics":{}}' > bandit-py-report.json
          [ -f bandit-nb-report.json ] \
            || echo '{"results":[],"metrics":{}}' > bandit-nb-report.json
          python3 -c "
          import json
          r = (json.load(open('bandit-py-report.json')).get('results',[])
             + json.load(open('bandit-nb-report.json')).get('results',[]))
          json.dump({'results': r}, open('bandit-report.json','w'))
          " || echo '{"results":[]}' > bandit-report.json

      # ── Ruff — scan only PR-changed Python files ──────────────────────────
      - name: Run Ruff
        id: ruff
        continue-on-error: true
        run: |
          PY_COUNT=$(wc -l < pr-changed-py.txt | tr -d ' ')
          if [ "${PY_COUNT}" -eq 0 ]; then
            echo "No Python files changed in this PR — skipping Ruff"
            echo "[]" > ruff-report.json
          else
            # --output-format json (not --format — removed in Ruff 0.6+).
            # Ruff writes the report to stdout; redirect to the report file
            # rather than using -o (which is a no-op in check mode in some
            # Ruff versions and silently produced an empty report).
            xargs -a pr-changed-py.txt -r ruff check \
              --output-format json > ruff-report.json || true
          fi
          # Ensure the file exists and is valid JSON; otherwise the aggregator
          # would log a parse warning and every PR would show zero Ruff findings.
          python3 -c "import json; json.load(open('ruff-report.json'))" 2>/dev/null \
            || echo "[]" > ruff-report.json
          echo "Ruff errors: $(python3 -c "import json; data=json.load(open('ruff-report.json')); print(sum(1 for r in data if (r.get('code') or '').startswith(('E','F','B'))))")"

          # ── Print Ruff ERROR-level findings in the pipeline log ───────────
          # Only blocking errors are surfaced here (codes starting with E/F/B —
          # same classification used by the aggregator's parse_ruff). Warnings
          # like G004/I001 are omitted to avoid confusing reviewers about what
          # actually fails the quality gate.
          echo ""
          echo "============================================================"
          echo "  🧹  RUFF — DETAILED FINDINGS"
          echo "============================================================"
          python3 <<'PYEOF'
          import json
          from collections import Counter

          try:
              data = json.load(open('ruff-report.json'))
          except Exception as e:
              print(f"[WARN] Could not read ruff-report.json: {e}")
              data = []

          def is_error(code: str) -> bool:
              return code.startswith(("E", "F", "B"))

          errors = [r for r in data if is_error(r.get("code") or "")]

          if not errors:
              print("  ✅ No Ruff errors found.")
          else:
              print(f"  Total errors: {len(errors)}")
              print("  ------------------------------------------------------------")
              for r in errors:
                  code = r.get("code") or "?"
                  msg  = r.get("message", "")
                  fn   = r.get("filename", "")
                  loc  = r.get("location") or {}
                  row  = loc.get("row", 0)
                  col  = loc.get("column", 0)
                  print(f"  {fn}:{row}:{col}  [{code}]  {msg}")

              print("  ------------------------------------------------------------")
              print("  Summary by rule:")
              counts = Counter((r.get("code") or "?") for r in errors)
              for code, n in counts.most_common():
                  print(f"    {code:<8} {n}")

              print("  Summary by file:")
              file_counts = Counter((r.get("filename") or "?") for r in errors)
              for fn, n in file_counts.most_common():
                  print(f"    {n:>4}  {fn}")
          PYEOF
          echo "============================================================"

      # ── Aggregate ─────────────────────────────────────────────────────────
      - name: Generate Aggregator Script
        run: |
          cat << 'PYEOF' > aggregate_reports.py
          #!/usr/bin/env python3
          """
          aggregate_reports.py  (v1.5 — SQLFluff removed)
          ----------------------------------------------------------------------
          Aggregates Gitleaks, jscpd, Semgrep, Bandit and Ruff JSON reports
          into a single unified quality report.
          """
          
          import argparse
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path


          # ── Path helpers ───────────────────────────────────────────────────────────

          def _rel_path(fn: str) -> str:
              """
              Convert tool-reported paths to repo-relative so the Databricks
              dashboard / PR detail page shows "lakehouse_framework/test/foo.py"
              instead of the self-hosted runner's absolute path
              (e.g. /home/ubuntu/actions-runner/_work/.../lakehouse_framework/...).

              Tries GITHUB_WORKSPACE first (exact prefix match), then falls back to
              os.path.relpath from CWD. Returns the original string on any failure.
              """
              if not fn:
                  return fn
              workspace = os.environ.get("GITHUB_WORKSPACE", "").rstrip("/")
              if workspace and fn.startswith(workspace + "/"):
                  return fn[len(workspace) + 1:]
              if os.path.isabs(fn):
                  try:
                      return os.path.relpath(fn, os.getcwd())
                  except ValueError:
                      return fn
              return fn
          
          
          # ── Loaders ────────────────────────────────────────────────────────────────
          
          def load_json(path: str, default):
              try:
                  with open(path) as f:
                      return json.load(f)
              except Exception as exc:
                  print(f"[WARN] Could not load {path}: {exc}", file=sys.stderr)
                  return default
          
          
          # ── Existing parsers (unchanged) ───────────────────────────────────────────
          
          def parse_gitleaks(raw) -> dict:
              if not isinstance(raw, list):
                  raw = []
              findings = []
              for item in raw:
                  findings.append({
                      "rule_id":     item.get("RuleID", "unknown"),
                      "file":        item.get("File", ""),
                      "line_start":  item.get("StartLine", 0),
                      "line_end":    item.get("EndLine", 0),
                      "secret":      (item.get("Secret", "") or "")[:20] + "…",
                      "description": item.get("Description", ""),
                  })
              return {"count": len(findings), "findings": findings}
          
          
          def parse_jscpd(raw) -> dict:
              stats = raw.get("statistics", {}).get("total", {})
              duplicates = []
              for dup in (raw.get("duplicates") or [])[:100]:
                  first  = dup.get("firstFile",  {})
                  second = dup.get("secondFile", {})
                  duplicates.append({
                      "file1":  first.get("name",  ""),
                      "start1": first.get("start", 0),
                      "end1":   first.get("end",   0),
                      "file2":  second.get("name",  ""),
                      "start2": second.get("start", 0),
                      "end2":   second.get("end",   0),
                      "lines":  dup.get("lines",   0),
                      "tokens": dup.get("tokens",  0),
                  })
              return {
                  "percentage":       round(float(stats.get("percentage",     0)), 2),
                  "clones":           int(stats.get("clones",          0)),
                  "duplicated_lines": int(stats.get("duplicatedLines", 0)),
                  "total_lines":      int(stats.get("lines",           0)),
                  "duplicates":       duplicates,
              }
          
          # def parse_jscpd(raw) -> dict:
          #     stats = raw.get("statistics", {}).get("total", {})
          #     duplicates = []
          
          #     # Iterate through clones using the correct flat keys: file1, file2, start1, etc.
          #     for dup in (raw.get("duplicates") or [])[:100]:
          #         duplicates.append({
          #             "file1":  dup.get("file1",  ""),
          #             "start1": dup.get("start1", 0),
          #             "end1":   dup.get("end1",   0),
          #             "file2":  dup.get("file2",  ""),
          #             "start2": dup.get("start2", 0),
          #             "end2":   dup.get("end2",   0),
          #             "lines":  dup.get("lines",  0),
          #             "tokens": dup.get("tokens", 0),
          #         })
          
          #     return {
          #         "percentage":       round(float(stats.get("percentage",     0)), 2),
          #         "clones":           int(stats.get("clones",          0)),
          #         "duplicated_lines": int(stats.get("duplicatedLines", 0)),
          #         "total_lines":      int(stats.get("lines",           0)),
          #         "duplicates":       duplicates,
          #     }
          
          
          def parse_semgrep(raw) -> dict:
              # Only keep ERROR-level findings; warnings/info are excluded from
              # the report so the Databricks dashboard stays clean.
              results  = raw.get("results", [])
              findings = []
              for r in results:
                  extra = r.get("extra", {})
                  sev   = extra.get("severity", "INFO").upper()
                  if sev != "ERROR":
                      continue
                  findings.append({
                      "rule_id":  r.get("check_id", ""),
                      "file":     r.get("path", ""),
                      "line":     r.get("start", {}).get("line", 0),
                      "message":  extra.get("message", ""),
                      "severity": sev,
                  })
              return {
                  "count":        len(findings),
                  "errors_count": len(findings),
                  "findings":     findings,
              }
          
          
          def parse_bandit(raw) -> dict:
              # Only keep HIGH severity findings; medium/low are treated as
              # warnings and excluded from the report.
              results  = raw.get("results", [])
              findings = []
              for r in results:
                  sev = r.get("issue_severity", "LOW").upper()
                  if sev != "HIGH":
                      continue
                  findings.append({
                      "test_id":    r.get("test_id",        ""),
                      "test_name":  r.get("test_name",      ""),
                      "file":       r.get("filename",       ""),
                      "line":       r.get("line_number",    0),
                      "severity":   sev,
                      "confidence": r.get("issue_confidence","LOW").upper(),
                      "message":    r.get("issue_text",     ""),
                      "source":     r.get("_source",        "python"),
                  })
              nb_count = sum(1 for f in findings if f["source"] == "notebook")
              return {
                  "count":          len(findings),
                  "high":           len(findings),
                  "notebook_count": nb_count,
                  "findings":       findings,
              }
          
          
          def parse_ruff(raw):
              # Only keep error-level rules (E/F/B prefixes); other rules are
              # treated as warnings and excluded from the report so the
              # Databricks dashboard only reflects real failures.
              if not isinstance(raw, list): raw = []
              findings = []
              for r in raw:
                  code = r.get("code") or ""
                  is_error = code.startswith("E") or code.startswith("F") or code.startswith("B")
                  if not is_error:
                      continue
                  findings.append({
                      "rule_id":  code,
                      "file":     _rel_path(r.get("filename", "")),
                      "line":     r.get("location", {}).get("row", 0),
                      "message":  r.get("message", ""),
                      "severity": "ERROR",
                  })

              return {
                  "count":    len(findings),
                  "errors":   len(findings),
                  "findings": findings,
              }
          
          # ── Status logic ───────────────────────────────────────────────────────────
          
          def determine_status(gl, jd, sg, bd, rf) -> str:
              """
              Fail the PR if ANY hard threshold is breached.

              Thresholds:
                secrets        : any found             (zero tolerance)
                duplication    : > 30 %
                semgrep        : any ERROR-level
                bandit         : any HIGH severity
                ruff           : any ERROR (includes ported Pylint PL rules)
              """
              if gl["count"] > 0:                  return "fail"
              if jd["percentage"] > 30:            return "fail"
              if sg.get("errors_count", 0) > 0:    return "fail"
              if bd.get("high", 0) > 0:            return "fail"
              if rf.get("errors", 0) > 0:          return "fail"
              return "pass"
          
          
          # ── Main ───────────────────────────────────────────────────────────────────
          
          def main():
              p = argparse.ArgumentParser()
              p.add_argument("--pr",            required=True)
              p.add_argument("--branch",        required=True)
              p.add_argument("--sha",           required=True)
              p.add_argument("--repo",          required=True)
              p.add_argument("--pr-title",      default="")
              p.add_argument("--pr-author",     default="unknown")
              p.add_argument("--workflow-url",  default="")
              p.add_argument("--gitleaks",      required=True)
              p.add_argument("--jscpd",         required=True)
              p.add_argument("--semgrep",       required=True)
              p.add_argument("--bandit",        required=True)
              p.add_argument("--ruff",          default="")
              p.add_argument("--output",        required=True)
              args = p.parse_args()
          
              gl  = parse_gitleaks(load_json(args.gitleaks, []))
              jd  = parse_jscpd(   load_json(args.jscpd,    {}))
              sg  = parse_semgrep( load_json(args.semgrep,   {}))
              bd  = parse_bandit(  load_json(args.bandit,    {}))
              rf  = parse_ruff(    load_json(args.ruff,      []))

              status = determine_status(gl, jd, sg, bd, rf)
          
              report = {
                  "schema_version": "1.3",
                  "pr_number":      args.pr,
                  "pr_title":       args.pr_title,
                  "pr_author":      args.pr_author,
                  "workflow_url":   args.workflow_url,
                  "branch":         args.branch,
                  "commit_sha":     args.sha,
                  "repo":           args.repo,
                  "timestamp":      datetime.now(timezone.utc).isoformat(),
                  "summary": {
                      "status":        status,
                      "secrets":       gl["count"],
                      "duplication":   jd["percentage"],
                      "bugs":          sg["count"],
                      "bugs_error":    sg.get("errors_count", 0),
                      "security":      bd["count"],
                      "security_high": bd["high"],
                      "ruff_errors":   rf["errors"],
                      # total_issues counts ONLY actual errors (no warnings).
                      # If ruff reports 1 error and nothing else fails, this is 1.
                      "total_issues": (
                          gl["count"] +
                          sg.get("errors_count", 0) +
                          bd["high"] +
                          rf["errors"]
                      ),
                  },
                  "gitleaks": gl,
                  "jscpd":    jd,
                  "semgrep":  sg,
                  "bandit":   bd,
                  "ruff":     rf,
              }
          
              Path(args.output).write_text(json.dumps(report, indent=2))
              print(
                  f"[OK] Report → {args.output}  |  status={status}  |  "
                  f"ruff={rf['count']} ({rf['errors']} errors)  |  "
                  f"semgrep={sg['count']}  |  bandit={bd['count']}  |  "
                  f"secrets={gl['count']}"
              )
          
          
          if __name__ == "__main__":
              main()
          
          PYEOF

      - name: Aggregate reports
        run: |
          python3 aggregate_reports.py \
            --pr            "${{ github.event.pull_request.number }}" \
            --branch        "${{ github.head_ref }}" \
            --sha           "${{ github.event.pull_request.head.sha }}" \
            --repo          "${{ github.repository }}" \
            --pr-title      "${{ github.event.pull_request.title }}" \
            --pr-author     "${{ github.event.pull_request.user.login }}" \
            --workflow-url  "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --gitleaks      gitleaks-report.json \
            --jscpd         jscpd-report/jscpd-report.json \
            --semgrep       semgrep-report.json \
            --bandit        bandit-report.json \
            --ruff          ruff-report.json \
            --output        combined-report.json

      # ── Upload to Databricks Volume ────────────────────────────────────────
      - name: Upload to Databricks Volume
        run: |
          REPORT_NAME="pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}.json"
          echo "Uploading ${REPORT_NAME}..."
          databricks fs cp combined-report.json \
            dbfs:/Volumes/abs_metadata_dev/code_quality/reports/${REPORT_NAME} \
            --overwrite
          echo "Uploaded: /Volumes/abs_metadata_dev/code_quality/reports/${REPORT_NAME}"
        env:
          DATABRICKS_HOST:          ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID:     ${{ vars.DATABRICKS_CLIENT_ID || secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

      # ── Quality Gate ──────────────────────────────────────────────────────
      - name: Quality Gate
        run: |
          # ── Print full diagnostic report ──────────────────────────────────
          echo "============================================================"
          echo "  📊  CODE QUALITY REPORT — DIAGNOSTIC SUMMARY"
          echo "============================================================"
          python3 -c "
          import json, sys

          report = json.load(open('combined-report.json'))
          s      = report.get('summary', {})

          print(f\"  PR          : #{report.get('pr_number','?')}  |  {report.get('pr_title','')}\")
          print(f\"  Author      : {report.get('pr_author','?')}\")
          print(f\"  Branch      : {report.get('branch','?')}\")
          print(f\"  Commit SHA  : {report.get('commit_sha','?')}\")
          print(f\"  Timestamp   : {report.get('timestamp','?')}\")
          print()
          print(f\"  ┌─────────────────────────────────────────────────────┐\")
          print(f\"  │  METRIC                    VALUE       THRESHOLD    │\")
          print(f\"  ├─────────────────────────────────────────────────────┤\")
          print(f\"  │  Secrets (Gitleaks)        {s.get('secrets',0):<12}0            │\")
          print(f\"  │  Code Duplication (jscpd)  {str(s.get('duplication',0))+'%':<12}≤ 20%        │\")
          print(f\"  │  Semgrep errors            {s.get('bugs_error',0):<12}0            │\")
          print(f\"  │  Bandit HIGH severity      {s.get('security_high',0):<12}0            │\")
          print(f\"  │  Ruff errors               {s.get('ruff_errors',0):<12}0            │\")
          print(f\"  │  TOTAL ERRORS              {s.get('total_issues',0):<12}0            │\")
          print(f\"  └─────────────────────────────────────────────────────┘\")
          print()
          print(f\"  Overall Status : {s.get('status','?').upper()}\")
          "
          echo "============================================================"
          echo ""

          # ── Determine pass/fail and print reasons ─────────────────────────
          STATUS=$(python3 -c "
          import json, sys
          report = json.load(open('combined-report.json'))
          status = report.get('summary', {}).get('status', 'fail')
          print(status)

          if status != 'pass':
              reasons = []
              s = report['summary']
              if s.get('secrets', 0) > 0:
                  reasons.append(f\"Secrets detected: {s['secrets']} found\")
              if s.get('duplication', 0) > 20:
                  reasons.append(f\"Duplication too high: {s['duplication']}% (limit: 20%)\")
              if s.get('bugs_error', 0) > 0:
                  reasons.append(f\"Semgrep errors: {s['bugs_error']} found\")
              if s.get('security_high', 0) > 0:
                  reasons.append(f\"Bandit HIGH severity: {s['security_high']} found\")
              if s.get('ruff_errors', 0) > 0:
                  reasons.append(f\"Ruff errors: {s['ruff_errors']} found\")
              for r in reasons:
                  print(f'  ❌ {r}', file=sys.stderr)
          ")

          echo "Quality Gate Status: ${STATUS}"

          if [ "$STATUS" != "pass" ]; then
            echo ""
            echo "❌ QUALITY GATE FAILED — PR is blocked from merging."
            echo "   Fix the issues above and push again."
            exit 1
          else
            echo "✅ QUALITY GATE PASSED — all thresholds met."
          fi