name: Load Test (Self-Hosted Runners)

on:
  workflow_dispatch:
    inputs:
      parallelism:
        description: 'Number of parallel jobs (1-10) — test the autoscaler ceiling'
        type: number
        default: 5
      duration:
        description: 'Work duration per job in seconds (how long each runner stays busy)'
        type: number
        default: 120
      load_iterations:
        description: 'CPU iterations per job (10000000 = ~0.5s CPU burst)'
        type: number
        default: 10000000

jobs:
  prepare:
    name: Generate shard matrix
    runs-on: [self-hosted, linux, x64]
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
    steps:
      - name: Generate shard list from parallelism input
        id: gen
        run: |
          # max-parallel cannot take expressions, so number of jobs is
          # produced via a dynamic matrix instead of strategy.max-parallel.
          echo "shards=$(python3 -c "import json; print(json.dumps(list(range(1, ${{ inputs.parallelism }} + 1))))")" >> "$GITHUB_OUTPUT"

  load-test:
    name: "Load shard ${{ matrix.shard }}"
    needs: prepare
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - name: Identify runner
        run: |
          echo "=== Load shard ${{ matrix.shard }} ==="
          echo "Container : $(hostname)"
          echo "Started   : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "CPU cores : $(nproc)"
          echo "Memory    : $(free -h | awk '/Mem:/{print $2}')"

      - name: CPU burst (simulated work)
        run: |
          echo "CPU burst: ${{ inputs.load_iterations }} iterations"
          python3 -c "sum(range(${{ inputs.load_iterations }}))"
          echo "CPU burst complete @ $(date -u '+%H:%M:%S UTC')"

      - name: Keep runner busy (autoscaler observation window)
        run: |
          echo "Working for ${{ inputs.duration }}s..."
          sleep ${{ inputs.duration }}
          echo "Completed @ $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
